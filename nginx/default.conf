upstream client{
    server client:5173;
}

upstream api{
    server api:3000;
}


server{
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs;
    ssl_certificate_key /etc/nginx/privkey;

    client_max_body_size 50M;

    location / {
        proxy_pass http://client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Rate-limited PDF route
    location ^~ /api/9818911707 {

    # Maximum 2 simultaneous connections per IP
    limit_conn pdf_conn 2;

    # Allow normal browsing, block excessive bursts
    limit_req zone=pdf_limit burst=20 nodelay;

    # Slow download speed slightly
    proxy_limit_rate 200k;

    proxy_pass http://api;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
    location /api {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
}


server {
    listen 80;

    server_name 110.44.121.77;
    return 301 https://portal.ncit.college;
   
}


